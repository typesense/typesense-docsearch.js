name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run test:types

      - name: Unit Tests
        run: bun run test --run

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Playwright 1.49's default download host redirects to one that can
      # time out; cdn.playwright.dev serves the same builds.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev

      # Global setup starts Typesense in Docker on port 8109.
      - name: Playwright E2E tests
        run: bun run pw:run

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
